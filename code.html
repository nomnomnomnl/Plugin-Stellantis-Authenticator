<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stellantis OAuth code</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1c1c1c; --muted: #5f6368; --box: #f1f3f4; --accent: #03a9f4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1c; --fg: #e8eaed; --muted: #9aa0a6; --box: #2d2e30; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 10vh auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    #code { display: block; background: var(--box); padding: 12px; border-radius: 8px; word-break: break-all; font-family: ui-monospace, monospace; }
    button { margin-top: 16px; padding: 10px 20px; font-size: 1rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    p.hint { color: var(--muted); font-size: .9rem; }
    footer { margin-top: 32px; color: var(--muted); font-size: .85rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="intro"></p>
    <code id="code" hidden></code>
    <button id="copy" type="button" hidden></button>
    <p class="hint" id="hint"></p>
    <footer>nomnomnomnl · <a href="https://github.com/nomnomnomnl/Plugin-Stellantis-Authenticator" target="_blank" rel="noopener">GitHub</a></footer>
  </main>
  <script src="code.js"></script>
</body>
</html>
